
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peti RM1 Juta</title>
<style>
body {
  background: radial-gradient(#273e61,#080d1b);
  color:white;
  font-family:Arial;
  text-align:center;
  overflow:hidden;
  margin:0;
}
h1 {color:gold;margin-top:35px}
#chest {
  font-size:140px;
  background:none;
  border:0;
  margin:50px 0 20px;
  cursor:pointer;
  touch-action:none;
  user-select:none;
}
#chest:active {transform:scale(.9)}
#count {font-size:35px;color:#00ff9d;font-weight:bold}
#status {font-size:19px;padding:10px}
#result {font-size:30px;color:gold;font-weight:bold}
.money {
  position:fixed;
  left:50%;
  top:45%;
  font-size:35px;
  pointer-events:none;
  animation:fly 2.5s ease-out forwards;
}
@keyframes fly {
  to {
    transform:translate(var(--x),var(--y)) rotate(800deg);
    opacity:0;
  }
}
@keyframes shake {
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-20px)}
  50%{transform:translateX(20px)}
  75%{transform:translateX(-15px)}
}
</style>
</head>
<body>

<h1>💰 PETI RM1 JUTA 💰</h1>
<h2>HADIAH RM1,000,000</h2>

<p>TEKAN DAN TAHAN PETI!</p>
<p>Sambil sebut SUBHANALLAH 3 KALI</p>

<button id="chest">🧰</button>

<div id="count">0 / 3</div>
<p id="status">Tekan dan tahan peti untuk bermula!</p>
<div id="result"></div>

<script>
const Speech =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

let holding = false;
let count = 0;
let finished = false;
let recognition;
let active = false;

const chest = document.getElementById("chest");
const status = document.getElementById("status");
const counter = document.getElementById("count");

function startVoice() {
  if (!Speech) {
    status.innerText = "Sila gunakan Google Chrome.";
    return;
  }

  if (active || finished) return;

  recognition = new Speech();
  recognition.lang = "ms-MY";
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = function(e) {
    if (!holding || finished) return;

    for(let i=e.resultIndex;i<e.results.length;i++) {
      if(e.results[i].isFinal) {
        let words = e.results[i][0].transcript
          .toLowerCase();

        let matches = words.match(/subhanallah/g);

        if(matches) {
          for(let j=0;j<matches.length;j++) {
            if(!holding || finished) break;

            count++;
            counter.innerText = count + " / 3";

            status.innerText =
              "Alhamdulillah! " + count + " kali!";

            if(count >= 3) {
              win();
              return;
            }
          }
        }
      }
    }
  };

  recognition.onerror = function() {
    if(!finished) {
      status.innerText =
        "Pastikan mikrofon dibenarkan.";
    }
  };

  recognition.onstart = function() {
    active = true;
  };

  recognition.onend = function() {
    active = false;

    if(holding && !finished) {
      try {
        recognition.start();
      } catch(e) {}
    }
  };

  try {
    recognition.start();
  } catch(e) {
    status.innerText = "Sila cuba lagi.";
  }
}

chest.addEventListener("pointerdown", function(e) {
  e.preventDefault();

  if(finished) return;

  holding = true;
  chest.setPointerCapture(e.pointerId);

  status.innerText =
    "🎤 Terus tekan! Sebut SUBHANALLAH!";

  startVoice();
});

function release() {
  holding = false;

  if(!finished) {
    status.innerText =
      "Jari dilepaskan! Tekan dan tahan semula.";
  }
}

chest.addEventListener("pointerup", release);
chest.addEventListener("pointercancel", release);

function win() {
  finished = true;
  holding = false;

  if(recognition) {
    recognition.onend = null;
    recognition.stop();
  }

  chest.innerText = "💥";
  chest.style.animation = "shake .4s";

  status.innerText = "PETI BERJAYA DIPECAHKAN!";

  document.getElementById("result").innerHTML =
    "🎉 TAHNIAH! 🎉<br>RM1,000,000!";

  for(let i=0;i<150;i++) {
    let m = document.createElement("div");
    m.className = "money";
    m.innerText = Math.random() > .5 ? "💵" : "💰";

    m.style.setProperty("--x",
      (Math.random()-.5)*1000+"px");
    m.style.setProperty("--y",
      (Math.random()-.5)*1000+"px");

    document.body.appendChild(m);
    setTimeout(()=>m.remove(),3000);
  }
}
</script>
</body>
</html>
